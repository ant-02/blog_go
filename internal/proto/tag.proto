syntax = "proto3";
option go_package = "/internal/pb";

package tag;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

message TagResponse {
    uint64 id = 1;
    string name = 2;
    google.protobuf.Timestamp createdAt = 3;
    google.protobuf.Timestamp updateAt = 4;
    google.protobuf.Timestamp deleteAt = 5;
}

message TagListResponse {
    repeated TagResponse tags = 1;
}

service TagService {
    rpc GetAll(google.protobuf.Empty) returns (TagListResponse);
}