syntax = "proto3";
option go_package = "/internal/pb";

package articleTag;

message ArticleTagIdRequest {
    uint64 id = 1;
}

message ArticleTagIdsResponse {
    repeated uint64 ids = 1;
}

service ArticleTagService {
    rpc GetTagIdsByArticleId(ArticleTagIdRequest) returns (ArticleTagIdsResponse);
}